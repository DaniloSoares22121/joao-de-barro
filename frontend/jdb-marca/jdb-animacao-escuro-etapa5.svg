<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="160" height="160"><style>
.bird{transform-box:view-box;transform-origin:30px 79px;animation:hop 5.6s ease-in-out infinite}
.head{transform-box:view-box;transform-origin:34px 30px}
.ball{animation:ball 5.6s linear infinite}
.patch{animation:patch 5.6s ease-in-out infinite}
@keyframes hop{
0%{transform:translate(0,0) rotate(0)}
6%{transform:translate(0,0) rotate(-5deg)}
11%{transform:translate(0,0) rotate(0)}
14%{transform:translate(2px,-6px) rotate(6deg)}
22%{transform:translate(45px,-40px) rotate(32deg)}
30%{transform:translate(105px,-50px) rotate(32deg)}
30.2%{transform:translate(-85px,-50px) rotate(30deg)}
48%{transform:translate(-40px,-30px) rotate(26deg)}
57%{transform:translate(-8px,-6px) rotate(10deg)}
62%{transform:translate(0,0) rotate(0)}
67%{transform:translate(0,0) rotate(18deg)}
71%{transform:translate(0,0) rotate(6deg)}
75%{transform:translate(0,0) rotate(18deg)}
80%{transform:translate(0,0) rotate(0)}
90%{transform:translate(0,0) rotate(-5deg)}
100%{transform:translate(0,0) rotate(0)}}
@keyframes ball{0%,38%{opacity:0}41%,72%{opacity:1}76%,100%{opacity:0}}
@keyframes patch{0%{opacity:1}20%,72%{opacity:0}78%,100%{opacity:1}}
@keyframes wing{0%,12%{opacity:0}14%,60%{opacity:1}62%,100%{opacity:0}}
@keyframes flap{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(30deg)}}
.wing{transform-box:view-box;transform-origin:24px 44px;animation:wing 5.6s linear infinite}
.wing path{transform-box:view-box;transform-origin:24px 44px;animation:flap .45s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bird,.ball,.patch,.wing,.wing path{animation:none}.ball,.wing{opacity:0}.bird{transform:none}}
